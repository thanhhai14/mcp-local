[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mid-project-system-mcp"
version = "0.1.0"
description = "Controlled project and Linux system administration MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mid-mcp = "mid_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mid_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
